<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Percha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<meta name="description" content="Elige qué ponerte con tu propia ropa y tus propias combinaciones.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/Geist.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/SourceSerif4.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <header class="top gut">
    <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6.5a2 2 0 1 1 2.6 1.9c-.4.1-.6.5-.6.9V11"/><path d="M12 11 3.6 16.9a1.2 1.2 0 0 0 .7 2.1h15.4a1.2 1.2 0 0 0 .7-2.1L12 11Z"/></svg>Percha</div>
    <button class="iconbtn" data-act="settings" aria-label="Ajustes"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </header>
  <div class="stage">
    <main id="view" class="gut"></main>
    <button class="fab" id="fab" data-act="addItem" aria-label="Añadir prenda" hidden></button>
  </div>
  <nav class="tabs gut" id="tabs"></nav>
</div>
<input type="file" id="f-photo" accept="image/*" multiple hidden>
<input type="file" id="imp-file" accept=".zip,application/zip,application/x-zip-compressed,.json,application/json" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
